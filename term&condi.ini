નિયમો અને શરતો (Terms & Conditions)

1. માહિતીનો ઉપયોગ
આ વેબસાઈટ પર આપેલી તમામ માહિતી માત્ર સામાન્ય જાણકારી માટે છે. વીમા સંબંધિત વિગતવાર નિયમો માટે કૃપા કરીને સત્તાવાર દસ્તાવેજોનો અભ્યાસ કરો.


2. ચોકસાઈ (Accuracy)
અમે માહિતી સચોટ રાખવાનો પ્રયત્ન કરીએ છીએ, પરંતુ કોઇ ભૂલ કે અધૂરાપણું હોય તો તેની જવાબદારી અમારી રહેશે નહીં.


3. વીમા કરાર (Insurance Contract)
વેબસાઈટ પર આપેલી માહિતી કોઇ પણ રીતે વીમા કરારનો ભાગ ગણાશે નહીં. વીમા સંબંધિત અધિકૃત દસ્તાવેજો જ માન્ય રહેશે.


4. વપરાશકર્તાની જવાબદારી
વપરાશકર્તા પોતાની વ્યક્તિગત માહિતી સાચી અને સચોટ આપે તે જરૂરી છે. ખોટી માહિતી આપવાથી થતી મુશ્કેલીઓ માટે વપરાશકર્તા જાતે જવાબદાર રહેશે.


5. કૉપિરાઈટ (Copyright)
આ વેબસાઈટની તમામ સામગ્રી – લખાણ, ફોટો, લોગો અને ડિઝાઇન – કાયદેસર સુરક્ષિત છે. તેની નકલ કે અનધિકૃત ઉપયોગ કાનૂની રીતે પ્રતિબંધિત છે.


6. ગોપનીયતા (Privacy)
આપેલી વ્યક્તિગત માહિતી સુરક્ષિત રાખવામાં આવશે અને તેનો દુરુપયોગ કરવામાં નહીં આવે.


7. ફેરફારનો અધિકાર
કંપનીને નિયમો અને શરતોમાં કોઇપણ સમયે ફેરફાર કરવાનો અધિકાર છે. ફેરફાર થયા બાદ વેબસાઈટ પર અપડેટેડ નિયમો લાગુ પડશે.




